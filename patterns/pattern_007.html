<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">패턴 로딩중...</title>

    <script>
    // =====================================================
    // ★ C#이 이 DATA 블록만 통째로 교체합니다 ★
    // ★ 이 블록 외에는 절대 수정하지 마세요 ★
    // =====================================================
    const DATA = {
    patternNo    : "7",
    patternTitle : "Do you",
    meaning      : "~하나요?",
    desc         : "이번에는 Do you 뒤에 동사원형을 추가하는 패턴입니다.<br>\"무엇 무엇하나요?\"라고 상대방의 행동을 묻는 문장을 연습합니다.<br>그럼 시작해 볼까요?",
    youtubeUrl   : "https://www.youtube.com/watch?v=1GdIWIOKR4M",
    grammarPoint : "\'Do you ~?\'는 일반동사가 포함된 의문문을 만들 때 사용하는 패턴으로, 주어가 2인칭(you)일 때 문장 앞에 <strong>Do</strong>를 붙여 질문합니다.<br>현재의 습관, 상태, 사실 등을 묻는 표현으로 일상 대화에서 매우 빈번하게 사용됩니다.<br>대답은 <strong>Yes, I do</strong> 또는 <strong>No, I don\'t</strong>로 간결하게 할 수 있습니다.",

    examples: [
        {   // 01
            s1_eng : "Do you exercise?",
            s1_kor : "당신은 운동하나요?",
            s2_s1  : "Do you exercise",
            s2_s2  : "regularly at the gym?",
            s2_kor : "헬스장에서 규칙적으로 운동하세요?",
            s3_s1  : "Do you exercise",
            s3_s2  : "regularly at the gym",
            s3_s3  : "even though you have a busy schedule?",
            s3_kor : "바쁜 스케줄에도 불구하고 헬스장에서 규칙적으로 운동하세요?",
            voca   : "<strong>regularly</strong> 규칙적으로 <span class=\'voca-sep\'>|</span> <strong>even</strong> though 비록 ~임에도 불구하고"
        },
        {   // 02
            s1_eng : "Do you live in Seoul?",
            s1_kor : "서울에 사시나요?",
            s2_s1  : "Do you live in Seoul",
            s2_s2  : "to learn Korean?",
            s2_kor : "한국어를 배우기 위해 서울에 사시나요?",
            s3_s1  : "Do you live in Seoul",
            s3_s2  : "to learn Korean,",
            s3_s3  : "or do you have another purpose?",
            s3_kor : "한국어를 배우기 위해 서울에 사시나요, 아니면 다른 목적이 있으신가요?",
            voca   : "<strong>purpose</strong> 목적 <span class=\'voca-sep\'>|</span> <strong>or</strong> 아니면, 또는"
        },
        {   // 03
            s1_eng : "Do you love me?",
            s1_kor : "저를 사랑하시나요?",
            s2_s1  : "Do you love me",
            s2_s2  : "to be sure?",
            s2_kor : "확실히 저를 사랑하시나요?",
            s3_s1  : "Do you love me",
            s3_s2  : "to be sure,",
            s3_s3  : "because I need to know?",
            s3_kor : "제가 알아야 하니, 확실히 저를 사랑하시나요?",
            voca   : "<strong>because</strong> ~이기 때문에 <span class=\'voca-sep\'>|</span> <strong>be</strong> sure 확실하다"
        },
        {   // 04
            s1_eng : "Do you trust me?",
            s1_kor : "저를 믿으시나요?",
            s2_s1  : "Do you trust me",
            s2_s2  : "enough?",
            s2_kor : "저를 충분히 믿으시나요?",
            s3_s1  : "Do you trust me",
            s3_s2  : "enough",
            s3_s3  : "to take this risk with me?",
            s3_kor : "저와 함께 이 위험을 감수할 만큼 저를 충분히 믿으시나요?",
            voca   : "<strong>enough</strong> 충분히 <span class=\'voca-sep\'>|</span> <strong>take</strong> a risk 위험을 감수하다"
        },
        {   // 05
            s1_eng : "Do you understand?",
            s1_kor : "당신은 이해하나요?",
            s2_s1  : "Do you understand",
            s2_s2  : "how to use this machine?",
            s2_kor : "이 기계 사용법을 이해하셨나요?",
            s3_s1  : "Do you understand",
            s3_s2  : "how to use this machine",
            s3_s3  : "before you start working?",
            s3_kor : "일을 시작하기 전에 이 기계 사용법을 이해하셨나요?",
            voca   : "<strong>before</strong> ~하기 전에 <span class=\'voca-sep\'>|</span> <strong>how</strong> to use 사용하는 방법"
        },
        {   // 06
            s1_eng : "Do you agree?",
            s1_kor : "동의하십니까?",
            s2_s1  : "Do you agree",
            s2_s2  : "on the terms of the contract?",
            s2_kor : "계약 조건에 동의하십니까?",
            s3_s1  : "Do you agree",
            s3_s2  : "on the terms of the contract,",
            s3_s3  : "which we discussed this morning?",
            s3_kor : "오늘 아침에 논의했던 계약 조건에 동의하십니까?",
            voca   : "<strong>agree</strong> on ~에 동의하다 <span class=\'voca-sep\'>|</span> <strong>terms</strong> 조건, 조항"
        },
        {   // 07
            s1_eng : "Do you smoke?",
            s1_kor : "담배 피우세요?",
            s2_s1  : "Do you smoke",
            s2_s2  : "regularly?",
            s2_kor : "담배를 규칙적으로 피우시나요?",
            s3_s1  : "Do you smoke",
            s3_s2  : "regularly,",
            s3_s3  : "especially after meals?",
            s3_kor : "식사 후에 특히 담배를 규칙적으로 피우시나요?",
            voca   : "<strong>especially</strong> 특히 <span class=\'voca-sep\'>|</span> <strong>after</strong> meals 식사 후에"
        },
        {   // 08
            s1_eng : "Do you work?",
            s1_kor : "당신은 일하나요?",
            s2_s1  : "Do you work",
            s2_s2  : "on weekends at home?",
            s2_kor : "주말에 집에서 일해요?",
            s3_s1  : "Do you work",
            s3_s2  : "on weekends at home,",
            s3_s3  : "or do you take a break?",
            s3_kor : "주말에 집에서 일해요, 아니면 쉬어요?",
            voca   : "<strong>on</strong> weekends 주말에 <span class=\'voca-sep\'>|</span> <strong>take</strong> a break 휴식을 취하다"
        },
        {   // 09
            s1_eng : "Do you remember?",
            s1_kor : "기억하세요?",
            s2_s1  : "Do you remember",
            s2_s2  : "our first meeting?",
            s2_kor : "우리 첫 만남을 기억하세요?",
            s3_s1  : "Do you remember",
            s3_s2  : "our first meeting",
            s3_s3  : "at the cafe last year?",
            s3_kor : "작년에 카페에서 있었던 우리 첫 만남을 기억하세요?",
            voca   : "<strong>remember</strong> 기억하다 <span class=\'voca-sep\'>|</span> <strong>first</strong> meeting 첫 만남"
        },
        {   // 10
            s1_eng : "Do you come here often?",
            s1_kor : "당신은 자주 오나요?",
            s2_s1  : "Do you come here often",
            s2_s2  : "to study?",
            s2_kor : "공부하러 여기 자주 오세요?",
            s3_s1  : "Do you come here often",
            s3_s2  : "to study,",
            s3_s3  : "or is this your first time?",
            s3_kor : "공부하러 자주 오시나요, 아니면 처음이신가요?",
            voca   : "<strong>or</strong> 아니면 <span class=\'voca-sep\'>|</span> <strong>first</strong> time 처음"
        }
    ],

    dialogueA_eng : "I\'ve been trying to get fit lately.",
    dialogueA_kor : "저 요즘 건강 관리 하려고 노력 중이에요.",
    dialogueB_eng : "Do you exercise regularly at the gym?",
    dialogueB_kor : "헬스장에서 규칙적으로 운동하세요?"
};
    // =====================================================
    // ★ 이 아래는 렌더링 엔진 — 절대 수정하지 마세요 ★
    // =====================================================
    </script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root {
            --primary:#1F2937; --secondary:#4F46E5; --border-color:#E5E7EB;
            
            /* [조합 1 적용] 화면과 인쇄가 일치하는 인쇄 안전 색상 세팅 */
            --c-step1:#000000; /* 1단계: 순수 검정 */
            --c-step2:#C2185B; /* 2단계: 클래식 마젠타 */
            --c-step3:#0F9D58; /* 3단계: 딥 그린 */
        }
        @page { size:A4; margin:0; }
        
        body { 
            font-family:'Pretendard',sans-serif; margin:0; padding:20px 0; background-color:#555; 
            display:flex; flex-direction:column; align-items:center; gap:20px; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale; 
            text-rendering: optimizeLegibility; 
        }
        
        .page-container { width:210mm; height:297mm; background-color:#FFF; box-sizing:border-box; padding:12mm 15mm; display:flex; flex-direction:column; box-shadow:0 10px 25px rgba(0,0,0,0.3); page-break-after:always; position:relative; }
        
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5mm; border-bottom:2px solid var(--primary); padding-bottom:3mm; flex-shrink:0; }
        .header-left { display:flex; flex-direction:column; justify-content:center; flex:1; padding-right:15px; } 
        .day-badge { background-color:var(--primary); color:white; padding:4px 16px; border-radius:20px; font-size:17px; font-weight:800; letter-spacing:1px; margin-bottom:8px; width:fit-content; }
        
        .pattern-title   { font-size:38px; font-weight:900; color:var(--primary); margin:0 0 6px 0; line-height:1; }
        .pattern-meaning { font-size:24px; font-weight:700; color:var(--secondary); margin:0; line-height:1.2; letter-spacing:-0.5px; word-break:keep-all; }
        
        .header-right { display:flex; align-items:center; padding-top:0; flex-shrink:0; }
        .qr-link-box { text-decoration:none; display:flex; transition:transform 0.2s; }
        .qr-link-box:hover { transform:scale(1.02); }
        .qr-box { display:grid; grid-template-columns:auto 15mm; grid-template-rows:auto 15mm; column-gap:6px; row-gap:3px; align-items:end; background:#F8FAFC; padding:6px 8px; border:1px solid var(--border-color); border-radius:8px; box-sizing:border-box; }
        
        .qr-top-text { grid-column:2; grid-row:1; font-size:12px; font-weight:800; color:var(--secondary); text-align:center; letter-spacing:-0.5px; line-height:1;}
        .qr-left-text { grid-column:1; grid-row:2; font-size:11px; font-weight:800; color:var(--secondary); text-align:right; line-height:1.3; letter-spacing:-0.5px; align-self:center; }
        .qr-image { grid-column:2; grid-row:2; width:15mm; height:15mm; border:1px solid var(--border-color); padding:2px; background-color:#fff; margin:0; box-sizing:border-box; }
        
        .grammar-prep { background-color:#FFFBEB; border-left:4px solid #F59E0B; padding:10px 14px; border-radius:6px; margin-bottom:2.5mm; font-size:15.5px; font-weight:500; color:#374155; display:flex; flex-direction:column; gap:5px; line-height:1.65; flex-shrink:0; word-break:keep-all; }
        .grammar-prep-title { font-weight:800; color:#D97706; font-size:16px; }

        .mini-header { border-bottom:2px solid var(--border-color); margin-bottom:3.5mm; padding-bottom:3mm; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
        .mini-title { font-size:19px; font-weight:800; color:var(--primary); }
        .table-container { width:100%; border:1px solid var(--border-color); border-radius:10px; overflow:hidden; flex-grow:1; display:flex; flex-direction:column; }
        .table-header { display:flex; flex-shrink:0; }
        .th-no { background-color:#E0E7FF; color:#1E3A5F; width:6%; text-align:center; padding:8px 0; font-size:13.5px; font-weight:800; flex-shrink:0; }
        .th-content { background-color:#EFF6FF; color:#1E3A5F; flex:1; text-align:left; padding:8px 12px; font-size:13.5px; font-weight:800; letter-spacing:0.3px; }
        
        .ex-row { display:flex; flex:1; border-top:1px solid var(--border-color); }
        .ex-row:nth-child(even) .ex-content { background-color:#F8FAFC; }
        .td-no { width:6%; flex-shrink:0; text-align:center; font-weight:800; color:#9CA3AF; font-size:15px; display:flex; align-items:center; justify-content:center; border-right:1px solid #F3F4F6; }
        .ex-content { flex:1; padding:9px 14px; display:flex; flex-direction:column; justify-content:center; }
        
        .line-inline { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; margin-bottom:2px; }
        .line-block  { margin-bottom:2px; }
        
        .eng-text { font-size:16px; font-weight:700; word-break:keep-all; }
        .kor-text { font-size:13.5px; font-weight:500; color:#4B5563; word-break:keep-all; }
        
        .c-s1 { color:var(--c-step1); } .c-s2 { color:var(--c-step2); } .c-s3 { color:var(--c-step3); }
        .inline-voca { display:inline-block; margin-top:5px; background-color:rgba(0,0,0,0.04); padding:3px 8px; border-radius:4px; font-size:13px; color:#334155; line-height:1.35; font-weight:500; }
        .inline-voca strong { color:#0F172A; font-weight:700; }
        .voca-sep { color:#CBD5E1; margin:0 5px; }
        
        .footer { margin-top:4mm; height:32mm; flex-shrink:0; display:flex; gap:15px; }
        .tip-box { flex-grow:1; background-color:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:12px 16px; display:flex; flex-direction:column; justify-content:center; }
        .tip-title { font-size:15.5px; font-weight:800; color:var(--secondary); margin-bottom:6px; }
        .tip-content { font-size:15.5px; color:#333; font-weight:500; line-height:1.6; }
        .dialogue-box { display:grid; grid-template-columns:24px 1fr; gap:6px; margin-top:2px; }
        .dialogue-speaker { font-weight:800; color:var(--primary); font-size:16px; }
        .dialogue-text { color:#1F2937; font-size:16px; font-weight:700; }
        
        .page-number { font-size:12.5px; color:#9CA3AF; text-align:center; font-weight:500; margin-top:auto; padding-top:10px; letter-spacing:1px; }

        #tbody-p1, #tbody-p2 { display:contents; }
        
        @media print {
            @page { size:A4; margin:0; }
            body { padding:0!important; margin:0!important; gap:0!important; background-color:#FFF!important; }
            .page-container { box-shadow:none!important; margin:0!important; height:296.5mm!important; page-break-after:always!important; page-break-inside:avoid!important; overflow:hidden!important; }
            .page-container:last-child { page-break-after:auto!important; }
            
            .pattern-title, .eng-text, .dialogue-speaker, .dialogue-text { color: #000000 !important; }
        }
    </style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page-container">
    <div class="header">
        <div class="header-left">
            <div class="day-badge" id="badge"></div>
            <h1 class="pattern-title" id="title"></h1>
            <p class="pattern-meaning" id="meaning"></p>
        </div>
        <div class="header-right">
            <a id="qr-link" href="#" target="_blank" class="qr-link-box">
                <div class="qr-box">
                    <div class="qr-top-text">영상 강의</div>
                    <div class="qr-left-text">클릭<br>또는<br>스캔</div>
                    <img id="qr-img" class="qr-image" src="" alt="QR Code">
                </div>
            </a>
        </div>
    </div>
    <div class="grammar-prep">
        <div class="grammar-prep-title">※ Grammar Point</div>
        <div id="grammar"></div>
    </div>
    <div class="table-container">
        <div class="table-header">
            <div class="th-no">번호</div>
            <!-- [수정됨] 화살표를 플러스 기호로 바꾸고 각 단계별 색상 적용 -->
            <div class="th-content">
                <span class="c-s1">짧게 말하기(초급)</span> &nbsp;+&nbsp; 
                <span class="c-s2">확장해서 말하기(중급)</span> &nbsp;+&nbsp; 
                <span class="c-s3">더 추가해서 말하기(고급)</span>
            </div>
        </div>
        <div id="tbody-p1"></div>
    </div>
    
    <div class="page-number" id="page-num-1"></div>
</div>

<!-- PAGE 2 -->
<div class="page-container">
    <div class="mini-header">
        <div class="mini-title" id="mini-title"></div>
        <div id="mini-sub" style="font-size:13.5px;color:#6B7280;font-weight:700;"></div>
    </div>
    <div class="table-container">
        <div id="tbody-p2"></div>
    </div>
    <div class="footer">
        <div class="tip-box">
            <div class="tip-title">💬 실전 롤플레이 (Mini Dialogue)</div>
            <div class="tip-content">
                <div class="dialogue-box">
                    <div class="dialogue-speaker">A:</div>
                    <div class="dialogue-text" id="dlg-a"></div>
                    <div class="dialogue-speaker">B:</div>
                    <div class="dialogue-text" id="dlg-b"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="page-number" id="page-num-2"></div>
</div>

<!-- 렌더링 엔진 -->
<script>
(function() {
    document.getElementById('page-title').textContent = `패턴 ${DATA.patternNo} - ${DATA.patternTitle}`;
    document.getElementById('badge').textContent   = `패턴 ${DATA.patternNo}`;
    document.getElementById('title').textContent   = DATA.patternTitle;
    document.getElementById('meaning').textContent = DATA.meaning;
    
    document.getElementById('qr-link').href        = DATA.youtubeUrl;
    document.getElementById('qr-img').src          = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(DATA.youtubeUrl)}`;
    
    document.getElementById('grammar').innerHTML   = DATA.grammarPoint;
    document.getElementById('mini-title').textContent = `패턴 ${DATA.patternNo} - 추가 예문으로 확실하게 내 것 만들기`;
    document.getElementById('mini-sub').textContent   = DATA.patternTitle;

    let pNo = parseInt(DATA.patternNo);
    if(!isNaN(pNo)) {
        document.getElementById('page-num-1').textContent = `- ${(pNo * 2) - 1} -`;
        document.getElementById('page-num-2').textContent = `- ${pNo * 2} -`;
    }

    function buildRow(ex, no) {
        const num = String(no).padStart(2, '0');
        return `
        <div class="ex-row">
            <div class="td-no">${num}</div>
            <div class="ex-content">
                <div class="line-inline">
                    <div class="eng-text"><span class="c-s1">${ex.s1_eng}</span></div>
                    <div class="kor-text">${ex.s1_kor}</div>
                </div>
                <div class="line-inline">
                    <div class="eng-text">
                        <span class="c-s1">${ex.s2_s1}</span>
                        <span class="c-s2"> ${ex.s2_s2}</span>
                    </div>
                    <div class="kor-text">${ex.s2_kor}</div>
                </div>
                <div class="line-block">
                    <div class="eng-text">
                        <span class="c-s1">${ex.s3_s1}</span>
                        <span class="c-s2"> ${ex.s3_s2}</span>
                        <span class="c-s3"> ${ex.s3_s3}</span>
                    </div>
                    <div class="kor-text" style="margin-bottom:2px;">${ex.s3_kor}</div>
                </div>
                <div class="inline-voca">${ex.voca}</div>
            </div>
        </div>`;
    }

    let p1html = '';
    for (let i = 0; i < 5; i++) p1html += buildRow(DATA.examples[i], i + 1);
    document.getElementById('tbody-p1').innerHTML = p1html;

    let p2html = '';
    for (let i = 5; i < 10; i++) p2html += buildRow(DATA.examples[i], i + 1);
    document.getElementById('tbody-p2').innerHTML = p2html;

    document.getElementById('dlg-a').innerHTML =
        `${DATA.dialogueA_eng} <span style="color:#6B7280;font-size:13.5px;font-weight:500;margin-left:6px;">(${DATA.dialogueA_kor})</span>`;
    document.getElementById('dlg-b').innerHTML =
        `${DATA.dialogueB_eng} <span style="color:#6B7280;font-size:13.5px;font-weight:500;margin-left:6px;">(${DATA.dialogueB_kor})</span>`;
})();
</script>
</body>
</html>
