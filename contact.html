<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 | 영어창고 MyEnglishVault</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap">
<style>
:root{--bg-paper:#FBFBF9;--bg-white:#FFFFFF;--text-black:#1A1A1A;--text-gray:#555555;--accent-color:#4F46E5;--border-color:#E2E2DF;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'SUIT',sans-serif;letter-spacing:-0.02em;}
body{background-color:var(--bg-paper);color:var(--text-black);line-height:1.6;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
header{background:var(--bg-white);padding:16px 5%;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:100;}.logo{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:900;color:var(--text-black);display:flex;align-items:center;gap:6px;letter-spacing:-0.03em;white-space:nowrap;}
.logo span{color:var(--accent-color);font-weight:800;font-size:18px;margin-top:1px;}
.container{max-width:760px;margin:0 auto;padding:64px 5% 100px;}
.page-title{font-size:30px;font-weight:900;color:var(--text-black);margin-bottom:8px;letter-spacing:-0.03em;}
.page-sub{font-size:15.5px;color:var(--text-gray);font-weight:500;margin-bottom:48px;padding-bottom:24px;border-bottom:1px solid var(--border-color);word-break:keep-all;line-height:1.7;}
.contact-card{background:var(--bg-white);border:1px solid var(--border-color);padding:36px 32px;margin-bottom:16px;display:flex;align-items:center;gap:24px;}
.contact-icon{width:44px;height:44px;border:1px solid var(--border-color);background:var(--bg-paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-icon svg{width:20px;height:20px;stroke:var(--accent-color);fill:none;stroke-width:2;}
.contact-body{}
.contact-label{font-size:12px;font-weight:800;color:var(--text-gray);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.contact-value{font-size:17px;font-weight:800;color:var(--text-black);}
.contact-value a{color:var(--accent-color);}
.contact-value a:hover{text-decoration:underline;}
.notice{background:var(--bg-white);border:1px solid var(--border-color);padding:24px 28px;margin-top:16px;}
.notice-title{font-size:12px;font-weight:800;color:var(--text-black);letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-color);}
.notice ul{display:flex;flex-direction:column;gap:8px;list-style:none;}
.notice li{font-size:14px;color:var(--text-gray);font-weight:500;line-height:1.7;word-break:keep-all;display:flex;gap:8px;}
.notice li::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--text-gray);margin-top:9px;flex-shrink:0;}
footer{text-align:center;padding:40px 20px;color:var(--text-gray);font-size:13px;border-top:1px solid var(--border-color);background:var(--bg-white);}
.footer-links{margin-bottom:12px;}
.footer-links a{color:var(--text-gray);font-weight:600;font-size:13px;margin:0 10px;}
.footer-links a:hover{color:var(--accent-color);}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">영어창고 <span>MyEnglishVault</span></a>
</header>

<div class="container">
  <h1 class="page-title">문의하기</h1>
  <p class="page-sub">영어창고에 대한 의견이나 문의사항이 있으시면 언제든지 연락해 주세요.</p>

  <div class="contact-card">
    <div class="contact-icon">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
    <div class="contact-body">
      <div class="contact-label">이메일</div>
      <div class="contact-value"><a href="mailto:hphong@hphong.com">hphong@hphong.com</a></div>
    </div>
  </div>

  <div class="notice">
    <div class="notice-title">안내사항</div>
    <ul>
      <li>문의하신 내용은 순서대로 검토 후 이메일로 답변드립니다.</li>
      <li>답변까지 영업일 기준 1~3일 소요될 수 있습니다.</li>
      <li>콘텐츠 오류, 개선 제안, 협업 제안 등 모든 의견을 환영합니다.</li>
    </ul>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="/privacy-policy.html">개인정보처리방침</a>
    <a href="/about.html">소개</a>
    <a href="/contact.html">문의</a>
  </div>
  <p>© 2026 영어창고 MyEnglishVault. All rights reserved.</p>
  <p style="margin-top:6px;">문의 : <a href="mailto:hphong@hphong.com" style="color:var(--text-gray);">hphong@hphong.com</a></p>
</footer>

</body>
</html>
